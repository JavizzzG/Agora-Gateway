services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1",
             "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agora-network

networks:
  agora-network:
    external: true
    name: agora-network