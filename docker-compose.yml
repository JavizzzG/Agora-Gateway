services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1",
             "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agora-network
    depends_on:
      redis:
        condition: service_healthy


  redis:
    image: redis:7-alpine
    container_name: redis-service
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agora-network

volumes:
  redis-data:
    driver: local
    name: redis-data

networks:
  agora-network:
    external: true
    name: agora-network