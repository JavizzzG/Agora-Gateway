server:
  port: 8080

spring:
  application:
    name: agora-gateway
  cloud:
    discovery:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      connect-timeout: 2000ms

# Clave pública EdDSA del auth-service
# En producción esto viene de variable de entorno
auth:
  public-key: ${AUTH_EDDSA_PUBLIC_KEY:MCowBQYDK2VwAyEAMLV/pdiJZKdjSl7uvOPALxn+d5p/DkmdnMuM3svVt8U=}
  token-cache:
    enabled: ${AUTH_TOKEN_CACHE_ENABLED:true}
    max-ttl-seconds: ${AUTH_TOKEN_CACHE_MAX_TTL_SECONDS:60}
    key-prefix: ${AUTH_TOKEN_CACHE_KEY_PREFIX:auth:token:valid:}

# URLs de los servicios — nombres de contenedor en agora-network
services:
  auth-url: ${AUTH_SERVICE_URL}
  user-url: ${USER_SERVICE_URL}
  workspace-url: ${WORKSPACE_SERVICE_URL}
  ai-agent-url: ${AI_AGENT_URL}
  media-url: ${MEDIA_SERVICE_URL}

# Resilience4j — circuit breakers
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true    # ← agrega esta línea
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException

    instances:
      # Circuit breaker para el user-service
      user-service:
        base-config: default

      # Circuit breaker para el workspace-service
      workspace-service:
        base-config: default

      # Auth-service con umbral más permisivo
      # Es crítico para el login — le damos más margen
      auth-service:
        base-config: default
        failure-rate-threshold: 70
        wait-duration-in-open-state: 15s

  # Timeout por request
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      user-service:
        base-config: default
      workspace-service:
        base-config: default
      auth-service:
        timeout-duration: 10s
      ai-agent-service:
        timeout-duration: 120s

# Exponer métricas del circuit breaker en actuator
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    root: INFO
    com.agora.gateway: INFO
    org.springframework.cloud.gateway: INFO
